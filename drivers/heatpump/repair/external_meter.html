<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Toshiba Estia</title>
  <style>
    .homey-form-group { margin-bottom: .75em; }
    #status { margin-top: .75em; font-size: .9em; }
  </style>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title" data-i18n="settings.meter_legend"></h1>
    <p class="homey-subtitle" data-i18n="settings.repair_help"></p>
  </header>

  <fieldset class="homey-form-fieldset">
    <div class="homey-form-group">
      <label id="device-name" class="homey-form-label" for="meter"></label>
      <select id="meter" class="homey-form-select"></select>
    </div>
  </fieldset>

  <button id="save" class="homey-button-primary-full" data-i18n="settings.save"></button>
  <div id="status" class="homey-text"></div>

  <script type="text/javascript">
    // Repair view: pick the external energy meter of this heat pump (same choice as on the app settings page).
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      el.textContent = Homey.__(el.getAttribute('data-i18n'));
    });
    const select = document.getElementById('meter');
    const saveEl = document.getElementById('save');

    // Homey.emit is callback-only on some Homey versions and Promise-only on others (AGENTS.md).
    function emit(event, data) {
      return new Promise(function(resolve, reject) {
        let settled = false;
        function done(err, val) {
          if (settled) return;
          settled = true;
          if (err) reject(err); else resolve(val);
        }
        try {
          const ret = Homey.emit(event, data, function(err, result) { done(err, result); });
          if (ret && typeof ret.then === 'function') ret.then(function(r) { done(null, r); }, done);
        } catch (e) { done(e); }
      });
    }

    emit('init').then(function(data) {
      document.getElementById('device-name').textContent = data.name;
      const none = document.createElement('option');
      none.value = '';
      none.textContent = Homey.__('settings.meter_none');
      select.appendChild(none);
      data.meters.forEach(function(meter) {
        const option = document.createElement('option');
        option.value = meter.id;
        option.textContent = meter.name;
        select.appendChild(option);
      });
      // The linked meter is gone (removed or paired again): keep it visible as such.
      if (data.meterId && !data.meters.some(function(m) { return m.id === data.meterId; })) {
        const gone = document.createElement('option');
        gone.value = data.meterId;
        gone.textContent = Homey.__('settings.meter_missing_option');
        select.appendChild(gone);
      }
      select.value = data.meterId || '';
    }).catch(function(err) {
      Homey.alert(err.message || String(err));
    });

    // Capture phase: Homey's own handler on homey-button-* stops the click before a button listener (AGENTS.md).
    document.addEventListener('click', function(e) {
      if (!e.target || e.target.id !== 'save' || saveEl.disabled) return;
      saveEl.disabled = true;
      emit('save', { meterId: select.value || null }).then(function() {
        Homey.done();
      }).catch(function(err) {
        saveEl.disabled = false;
        Homey.alert(Homey.__('settings.meter_error') + (err.message || String(err)));
      });
    }, true);
  </script>
</body>
</html>
